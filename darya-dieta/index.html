<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102119">
  <title>DIETA — растения-учителя Амазонии</title>
  <style>
    body{margin:0;background:#f8f1e3;color:#17251e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}.box{max-width:520px}.mark{width:54px;height:54px;border:1px solid #c9a56a;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-weight:800}p{font-size:18px;line-height:1.55;color:#4b5a51}
  </style>
</head>
<body>
  <div class="box"><div class="mark">D</div><p>Открываю путеводитель...</p></div>
  <script>
    (async function(){
      const source='https://raw.githubusercontent.com/suyzy3103-gif/bella-psychologist.com/157cb8dd9f784ebc4275769ae4bb65d792acd7ab/darya-dieta/index.html';
      const response=await fetch(source,{cache:'no-store'});
      let html=await response.text();

      html=html.replace('</style>','.dieta-meaning-section{padding:46px 0 34px;background:linear-gradient(135deg,rgba(255,255,255,.64),rgba(248,241,227,.92))}.dieta-meaning-card{border:1px solid rgba(201,165,106,.5);border-radius:34px;background:rgba(255,255,255,.7);box-shadow:0 22px 60px rgba(16,33,25,.1);padding:34px;position:relative;overflow:hidden}.dieta-meaning-card:before{content:"";position:absolute;inset:16px;border:1px solid rgba(201,165,106,.22);border-radius:26px;pointer-events:none}.dieta-meaning-card .kicker{color:#8b6e35}.dieta-meaning-card h3{margin:10px 0 18px}.dieta-meaning-card p{font-size:19px;color:#314239}.dieta-meaning-card .accent{font:italic 500 22px/1.45 Georgia,"Times New Roman",serif;color:#17251e}</style>');

      const meaning='<section class="dieta-meaning-section"><div class="wrap"><div class="dieta-meaning-card"><div class="kicker">Смысл слова dieta</div><h3>Dieta — это не про запреты ради запретов.</h3><p class="accent">Dieta - это временный способ жизни, в котором человек убирает лишнее, чтобы вступить в более тонкое взаимодействие с растением, телом, снами, вниманием и намерением.</p><p>Глубинный смысл dieta - не в том, чтобы «терпеть запреты», а в том, чтобы создать пространство для связи с растением, вниманием и собственным намерением.</p><p>В амазонской практике это сочетание приёма растения, социальной изоляции, пищевых ограничений и сексуального воздержания. Внутри традиционной модели считается, что при таких условиях духи растений могут проявляться через видения, сны или песни, а человек получает возможность учиться у природы.</p></div></div></section>';
      html=html.replace(/(<section class="hero">[\s\S]*?<\/section>)/, '$1'+meaning);
      html=html.replace(/Цифровой путеводитель/g,'Путеводитель').replace(/цифровой путеводитель/g,'путеводитель');

      html=html.replace(/<div><p class="lead">Каталог сделан[\s\S]*?Wikimedia Commons\.<\/p><\/div>/,'<div><p class="lead">Раздел будет расширяться по мере добавления новых растений.</p></div>');
      html=html.replace(/<div>\s*<p class="lead">Каталог сделан[\s\S]*?Wikimedia Commons\.\s*<\/p>\s*<\/div>/,'<div><p class="lead">Раздел будет расширяться по мере добавления новых растений.</p></div>');

      html=html.replace('Ответственный проводник может ясно','Просвещённый проводник может ясно');
      html=html.replace('Ответственный проводник способен ясно','Просвещённый проводник может ясно');
      html=html.replace(/<details class="faq-item"><summary class="faq-summary">Есть ли доказательства лечебной эффективности\?<\/summary>[\s\S]*?<\/details>/,'');

      html=html.replace(/<div class="kicker" style="color:#d8b97c">Связаться с Дарьей<\/div>[\s\S]*?<div class="contact-list">/,'<div class="kicker" style="color:#d8b97c">Связаться с Дарьей</div><h3>Практика начинается не с выбора «самого сильного» растения, а с понимания человека, его состояния, запроса и готовности к процессу.</h3><p>Напишите Дарье в WhatsApp, чтобы узнать, подходит ли вам такое направление, задать вопросы о формате и понять, с чего лучше начать.</p><p>В WhatsApp-группе вы получите дополнительную информацию, познакомитесь с направлением и спокойно разберётесь, как устроена практика.</p><div class="contact-list">');

      document.open();document.write(html);document.close();
    })().catch(function(){document.body.innerHTML='<div class="box"><div class="mark">D</div><p>Обновите страницу через минуту.</p></div>';});
  </script>
</body>
</html>
