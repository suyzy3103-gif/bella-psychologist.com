<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102119">
  <title>DIETA — растения-учителя Амазонии</title>
  <style>
    body{margin:0;background:#f8f1e3;color:#17251e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}.box{max-width:520px}.mark{width:54px;height:54px;border:1px solid #c9a56a;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-weight:800}p{font-size:18px;line-height:1.55;color:#4b5a51}
  </style>
</head>
<body>
  <div class="box"><div class="mark">D</div><p>Открываю путеводитель...</p></div>
  <script>
    (async function(){
      const source='https://raw.githubusercontent.com/suyzy3103-gif/bella-psychologist.com/157cb8dd9f784ebc4275769ae4bb65d792acd7ab/darya-dieta/index.html';
      const response=await fetch(source,{cache:'no-store'});
      let html=await response.text();
      html=html.replace('</style>','.hero-meaning{margin:18px 0 20px;padding:22px;border:1px solid rgba(201,165,106,.42);border-radius:24px;background:rgba(255,255,255,.52);box-shadow:0 14px 38px rgba(16,33,25,.07)}.hero-meaning p{font-size:18px;margin:0;color:#314239}.hero-meaning p+p{margin-top:12px}</style>');
      const oldHero='<h1 class="serif">DIETA</h1>\n          <h2 class="serif">Растение как учитель. Тишина как пространство для слушания.</h2>\n          <p>Цифровой путеводитель по традиции растений-учителей Амазонии: что такое dieta, какую роль играет маэстро, почему ограничения считаются частью процесса, какие растения чаще всего упоминаются и где проходит граница между традицией, исследованием и безопасностью.</p>';
      const newHero='<h1 class="serif">DIETA</h1>\n          <div class="hero-meaning">\n            <p><strong>Dieta</strong> - это временный способ жизни, в котором человек убирает лишнее, чтобы вступить в более тонкое взаимодействие с растением, телом, снами, вниманием и намерением.</p>\n            <p>Глубинный смысл dieta - не в том, чтобы «терпеть запреты», а в том, чтобы создать пространство для связи с растением, вниманием и собственным намерением.</p>\n            <p>В амазонской практике это сочетание приёма растения, социальной изоляции, пищевых ограничений и сексуального воздержания. Внутри традиционной модели считается, что при таких условиях духи растений могут проявляться через видения, сны или песни, а человек получает возможность учиться у природы.</p>\n          </div>\n          <h2 class="serif">Растение как учитель. Тишина как пространство для слушания.</h2>\n          <p>Путеводитель по традиции растений-учителей Амазонии: что такое dieta, какую роль играет маэстро, почему ограничения считаются частью процесса, какие растения чаще всего упоминаются и где проходит граница между традицией, исследованием и безопасностью.</p>';
      html=html.replace(oldHero,newHero);
      html=html.replace('Цифровой путеводитель по традиции','Путеводитель по традиции');
      const plantBlock='<div><p class="lead">Каталог сделан аккордеоном: человек видит названия, открывает интересующую карточку и получает краткое описание с фотографией растения. Раздел будет расширяться по мере проверки источников и таксономии.</p><p class="note">Формулировки «используют при» и «связывают с» не означают доказанную эффективность. Фотографии подтягиваются из открытых источников Wikimedia Commons, поэтому для редких растений изображение может появиться не сразу.</p></div>';
      html=html.replace(plantBlock,'');
      html=html.replace('Ответственный проводник может ясно','Просвещённый проводник может ясно');
      html=html.replace('Ответственный проводник способен ясно','Просвещённый проводник может ясно');
      html=html.replace('<details class="faq-item"><summary class="faq-summary">Есть ли доказательства лечебной эффективности?</summary><p>Доказательная база неоднородна. Есть этнографические, качественные и наблюдательные работы, а по отдельным растениям — лабораторные исследования. Для многих заявлений клинических подтверждений у человека недостаточно.</p></details>','');
      const oldContact='<div class="kicker" style="color:#d8b97c">Связаться с Дарьей</div>\n              <h3>Практика начинается не с выбора «самого сильного» растения, а с понимания человека.</h3>\n              <p>Если вы хотите обсудить формат, задать вопросы о процессе или понять, подходит ли вам такое направление вообще, можно написать Дарье напрямую в WhatsApp или перейти в группу.</p>';
      const newContact='<div class="kicker" style="color:#d8b97c">Связаться с Дарьей</div>\n              <h3>Практика начинается не с выбора «самого сильного» растения, а с понимания человека, его состояния, запроса и готовности к процессу.</h3>\n              <p>Напишите Дарье в WhatsApp, чтобы узнать, подходит ли вам такое направление, задать вопросы о формате и понять, с чего лучше начать.</p>\n              <p>В WhatsApp-группе вы получите дополнительную информацию, познакомитесь с направлением и спокойно разберётесь, как устроена практика.</p>';
      html=html.replace(oldContact,newContact);
      document.open();document.write(html);document.close();
    })().catch(function(){document.body.innerHTML='<div class="box"><div class="mark">D</div><p>Обновите страницу через минуту.</p></div>';});
  </script>
</body>
</html>
